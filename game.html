<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            var mode = new URLSearchParams(location.search).get("mode");
            if (mode !== "new" && mode !== "continue") location.replace("./index.html");
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Space Hunt">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#050217">
    <meta name="description" content="Fly through space and collect glowing balls.">
    <title>Play · Harlie Space Hunt</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="public/icons/icon-192.png">
    <link rel="apple-touch-icon" href="public/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <canvas id="game" aria-label="Space hunt play area"></canvas>

    <div class="hud-cluster">
        <button type="button" class="settings-btn" id="open-settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" fill-rule="evenodd" d="M9.85 2.15A1.15 1.15 0 0 1 10.97 1.2h2.06c.54 0 1 .37 1.12.9l.26 1.2c.5.16 1 .4 1.44.68l1.1-.52a1.15 1.15 0 0 1 1.42.38l1.03 1.79c.27.47.17 1.07-.24 1.42l-.94.8c.16.48.26.98.3 1.5l1.22.23c.53.1.9.56.9 1.1v2.06c0 .54-.37 1-.9 1.1l-1.22.23c-.04.52-.14 1.02-.3 1.5l.94.8c.41.35.51.95.24 1.42l-1.03 1.79a1.15 1.15 0 0 1-1.42.38l-1.1-.52c-.45.29-.93.52-1.44.68l-.26 1.2a1.15 1.15 0 0 1-1.12.9h-2.06a1.15 1.15 0 0 1-1.12-.9l-.26-1.2a7.4 7.4 0 0 1-1.44-.68l-1.1.52a1.15 1.15 0 0 1-1.42-.38L3.7 16.92a1.15 1.15 0 0 1 .24-1.42l.94-.8a7.4 7.4 0 0 1-.3-1.5l-1.22-.23a1.15 1.15 0 0 1-.9-1.1v-2.06c0-.54.37-1 .9-1.1l1.22-.23c.04-.52.14-1.02.3-1.5l-.94-.8A1.15 1.15 0 0 1 3.7 7.08l1.03-1.79a1.15 1.15 0 0 1 1.42-.38l1.1.52c.45-.29.93-.52 1.44-.68l.26-1.2Zm2.15 13.1a3.25 3.25 0 1 0 0-6.5 3.25 3.25 0 0 0 0 6.5Z"/>
            </svg>
        </button>
        <section class="panel hud-stats" aria-live="polite" aria-label="Score and time">
            <div class="hud-stats-row">
                <p class="value" aria-label="Found"><span id="found-count">0</span> / <span id="goal-count">75</span></p>
                <p class="value hud-score" id="play-score" aria-label="Score">0</p>
                <p class="value hud-timer" id="play-timer" aria-label="Play time">0:00</p>
            </div>
        </section>
    </div>

    <p class="coords" id="coords">0, 0</p>

    <div class="controls">
        <div class="joystick" id="joystick" role="application" aria-label="Ship joystick">
            <div class="joystick-base">
                <span class="joystick-ring" data-ring="slow"></span>
                <span class="joystick-ring" data-ring="medium"></span>
                <span class="joystick-ring" data-ring="fast"></span>
                <div class="joystick-knob" id="joystick-knob"></div>
            </div>
        </div>
        <button type="button" class="boost-btn" id="boost-btn" aria-pressed="false" aria-label="Hold to double ship speed">2×</button>
    </div>

    <canvas id="minimap" class="minimap" aria-label="Minimap" role="button" aria-pressed="false"></canvas>

    <div class="settings-overlay hidden" id="settings-menu" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="settings-sheet">
            <div class="settings-head">
                <h1 id="settings-title">Settings</h1>
                <button type="button" class="settings-close" id="settings-close" aria-label="Close settings">×</button>
            </div>

            <div class="settings-body">
            <section class="settings-block">
                <p class="label">Username</p>
                <input type="text" class="username-input" id="username-input" maxlength="20" autocomplete="username" enterkeyhint="done" spellcheck="false" placeholder="Pilot" aria-label="Username">
            </section>

            <section class="settings-block">
                <button type="button" class="settings-board" id="settings-board">Leaderboard</button>
            </section>

            <section class="settings-block">
                <p class="label">Fullscreen</p>
                <div class="fullscreen-choices" role="group" aria-label="Fullscreen">
                    <button type="button" class="fullscreen-btn" data-fullscreen="on">On</button>
                    <button type="button" class="fullscreen-btn is-on" data-fullscreen="off">Off</button>
                </div>
            </section>

            <section class="settings-block">
                <div class="settings-heading">
                    <p class="label">Balls</p>
                    <p class="value"><span id="balls-slider-value">75</span></p>
                </div>
                <input type="range" id="balls-slider" min="25" max="250" step="5" value="75" aria-label="Balls in the game">
            </section>

            <section class="settings-block">
                <div class="settings-heading">
                    <p class="label">Goal</p>
                    <p class="value"><span id="goal-slider-value">75</span></p>
                </div>
                <input type="range" id="goal-slider" min="5" max="75" step="5" value="75" aria-label="Balls to win">
            </section>

            <section class="settings-block">
                <p class="label">Colors</p>
                <div class="palette-choices" role="group" aria-label="Color palette">
                    <button type="button" class="palette-btn is-on" data-palette="rainbow">Rainbow</button>
                    <button type="button" class="palette-btn" data-palette="space">Space</button>
                    <button type="button" class="palette-btn" data-palette="dark">Dark</button>
                </div>
            </section>

            <section class="settings-block">
                <p class="label">Pulse</p>
                <div class="pulse-choices" role="group" aria-label="Ball pulse">
                    <button type="button" class="pulse-btn is-on" data-pulse="on">On</button>
                    <button type="button" class="pulse-btn" data-pulse="off">Off</button>
                </div>
            </section>

            <section class="settings-block">
                <div class="settings-heading">
                    <p class="label">Lifetime</p>
                    <p class="value" id="lifetime-points" aria-label="Lifetime points">0</p>
                </div>
                <p class="label">Locks</p>
                <div class="pulse-choices" role="group" aria-label="Ship point locks">
                    <button type="button" class="req-btn is-on" data-req="on">On</button>
                    <button type="button" class="req-btn" data-req="off">Off</button>
                </div>
                <p class="label ship-picker-label">Ship</p>
                <div class="ship-choices" role="group" aria-label="Ship">
                    <button type="button" class="ship-btn is-on" data-ship="classic" aria-label="Classic ship">
                        <svg viewBox="0 0 32 40" aria-hidden="true">
                            <path fill="#dce7ff" d="M16 2 30 34 16 26 2 34Z"/>
                            <ellipse fill="#6aa2ff" cx="16" cy="18" rx="4" ry="5.5"/>
                        </svg>
                    </button>
                    <button type="button" class="ship-btn is-locked" data-ship="ship-1" aria-label="Crew ship">
                        <img src="public/images/ships/ship-1.png" alt="">
                        <span class="ship-lock">5,000</span>
                    </button>
                    <button type="button" class="ship-btn is-locked" data-ship="cat" aria-label="Cat ship">
                        <img src="public/images/ships/cat.png" alt="">
                        <span class="ship-lock">7,500</span>
                    </button>
                    <button type="button" class="ship-btn is-locked" data-ship="wolf" aria-label="Wolf ship">
                        <img src="public/images/ships/wolf.png" alt="">
                        <span class="ship-lock">11,250</span>
                    </button>
                    <button type="button" class="ship-btn is-locked" data-ship="cube" aria-label="Cube ship">
                        <img src="public/images/ships/cube.png" alt="">
                        <span class="ship-lock">16,880</span>
                    </button>
                    <button type="button" class="ship-btn is-locked" data-ship="hello-kitty" aria-label="Hello Kitty ship">
                        <img src="public/images/ships/hello-kitty.png" alt="">
                        <span class="ship-lock">25,320</span>
                    </button>
                    <button type="button" class="ship-btn is-locked" data-ship="ufo" aria-label="UFO ship">
                        <img src="public/images/ships/ufo.png" alt="">
                        <span class="ship-lock">37,970</span>
                    </button>
                    <button type="button" class="ship-btn is-locked" data-ship="harlie" aria-label="Harlie ship">
                        <img src="public/images/ships/harlie.png" alt="">
                        <span class="ship-lock">56,960</span>
                    </button>
                    <button type="button" class="ship-btn is-locked" data-ship="selah" aria-label="Selah ship">
                        <img src="public/images/ships/selah.png" alt="">
                        <span class="ship-lock">85,430</span>
                    </button>
                    <button type="button" class="ship-btn is-locked" data-ship="guitar" aria-label="Guitar ship">
                        <img src="public/images/ships/guitar.png" alt="">
                        <span class="ship-lock">128,150</span>
                    </button>
                    <button type="button" class="ship-btn is-locked" data-ship="selah-harlie" aria-label="Selah and Harlie ship">
                        <img src="public/images/ships/selah-harlie.png" alt="">
                        <span class="ship-lock">192,220</span>
                    </button>
                </div>
            </section>

            <section class="settings-block">
                <p class="label">World size</p>
                <div class="world-sizes" role="group" aria-label="World size">
                    <button type="button" class="world-btn" data-world="5000" data-size="sm">sm</button>
                    <button type="button" class="world-btn" data-world="10000" data-size="md">md</button>
                    <button type="button" class="world-btn" data-world="15000" data-size="lg">lg</button>
                    <button type="button" class="world-btn is-on" data-world="20000" data-size="xl">xl</button>
                </div>
            </section>
            </div>

            <div class="settings-actions">
                <button type="button" class="settings-home" id="settings-home">Home</button>
                <button type="button" class="settings-restart" id="settings-restart">Restart</button>
                <button type="button" class="settings-continue" id="settings-continue">Continue</button>
            </div>
        </div>
    </div>

    <div class="overlay hidden" id="resume-overlay" role="dialog" aria-modal="true" aria-labelledby="resume-title">
        <div class="win-card resume-card">
            <h1 id="resume-title">CONTINUE?</h1>
            <p id="resume-message">A game is in progress.</p>
            <div class="resume-actions">
                <button type="button" class="resume-new" id="resume-new">New game</button>
                <button type="button" class="resume-continue" id="resume-continue">Continue</button>
            </div>
        </div>
    </div>

    <div class="overlay hidden" id="board-overlay" role="dialog" aria-modal="true" aria-labelledby="board-title">
        <div class="win-card board-card">
            <div class="board-head">
                <button type="button" class="board-back" id="board-back">Back</button>
                <button type="button" class="board-close" id="board-close" aria-label="Close leaderboard">×</button>
            </div>
            <h1 id="board-title">SCORES</h1>
            <div class="board-table" id="board-table" role="table" aria-label="Leaderboard">
                <div class="board-cols" role="row">
                    <span class="board-rank">#</span>
                    <span class="board-name">Name</span>
                    <span class="board-score">Score</span>
                    <span class="board-time">Time</span>
                    <span class="board-date">Date</span>
                </div>
                <div class="board-list" id="board-list"></div>
            </div>
            <p class="board-empty hidden" id="board-empty">No wins yet.</p>
        </div>
    </div>

    <div class="overlay hidden" id="win-overlay">
        <div class="win-card">
            <h1>YOU WON</h1>
            <p class="win-score" id="win-score">0</p>
            <p id="win-message">You reached the goal.</p>
            <div class="win-actions">
                <button type="button" id="win-board">Leaderboard</button>
                <button type="button" id="win-restart">Restart</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
