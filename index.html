<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Harlie Space Hunt</title>
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <canvas id="game" aria-label="Space hunt play area"></canvas>

    <div class="hud">
        <section class="panel score-panel" aria-live="polite">
            <p class="label">Found</p>
            <p class="value"><span id="found-count">0</span> / <span id="goal-count">75</span></p>
            <p class="sub" id="balls-left">75 balls in space</p>
        </section>

        <section class="panel goal-panel">
            <p class="label">Goal</p>
            <div class="stepper">
                <button type="button" id="goal-minus" aria-label="Lower goal">−</button>
                <span id="goal-stepper">75</span>
                <button type="button" id="goal-plus" aria-label="Raise goal">+</button>
            </div>
        </section>

        <button type="button" class="add-btn" id="add-balls">+ Add 5 balls</button>
    </div>

    <p class="coords" id="coords">0, 0</p>

    <div class="joystick" id="joystick" role="application" aria-label="Ship joystick">
        <div class="joystick-base">
            <span class="joystick-ring" data-ring="slow"></span>
            <span class="joystick-ring" data-ring="medium"></span>
            <span class="joystick-ring" data-ring="fast"></span>
            <div class="joystick-knob" id="joystick-knob"></div>
        </div>
    </div>

    <canvas id="minimap" class="minimap" aria-label="Minimap"></canvas>
    <p class="hint">W A S D or the joystick to fly</p>

    <div class="overlay hidden" id="win-overlay">
        <div class="win-card">
            <h1>All found</h1>
            <p id="win-message">You collected the goal.</p>
            <button type="button" id="keep-flying">Keep flying</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
