<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Space Hunt">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#050217">
    <meta name="description" content="Fly through space and collect glowing balls.">
    <title>Harlie Space Hunt</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="public/icons/icon-192.png">
    <link rel="apple-touch-icon" href="public/icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <canvas id="game" aria-label="Space hunt play area"></canvas>

    <section class="panel hud-stats" aria-live="polite" aria-label="Score and time">
        <div class="hud-stats-row">
            <p class="value" aria-label="Found"><span id="found-count">0</span> / <span id="goal-count">75</span></p>
            <p class="value hud-score" id="play-score" aria-label="Score">0</p>
            <p class="value hud-timer" id="play-timer" aria-label="Play time">0:00</p>
        </div>
    </section>

    <button type="button" class="settings-btn" id="open-settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.2 7.2 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.81 8.48a.5.5 0 0 0 .12.64L4.96 10.7c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.43.34.68.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.05.24.25.42.49.42h3.8c.24 0 .44-.18.49-.42l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96c.25.12.54.02.68-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/>
        </svg>
    </button>

    <p class="coords" id="coords">0, 0</p>

    <div class="controls">
        <div class="joystick" id="joystick" role="application" aria-label="Ship joystick">
            <div class="joystick-base">
                <span class="joystick-ring" data-ring="slow"></span>
                <span class="joystick-ring" data-ring="medium"></span>
                <span class="joystick-ring" data-ring="fast"></span>
                <div class="joystick-knob" id="joystick-knob"></div>
            </div>
        </div>
        <button type="button" class="boost-btn" id="boost-btn" aria-pressed="false" aria-label="Hold to double ship speed">2×</button>
    </div>

    <canvas id="minimap" class="minimap" aria-label="Minimap" role="button" aria-pressed="false"></canvas>

    <div class="settings-overlay hidden" id="settings-menu" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="settings-sheet">
            <div class="settings-head">
                <h1 id="settings-title">Settings</h1>
                <button type="button" class="settings-close" id="settings-close" aria-label="Close settings">×</button>
            </div>

            <div class="settings-body">
            <section class="settings-block">
                <p class="label">Username</p>
                <input type="text" class="username-input" id="username-input" maxlength="20" autocomplete="username" enterkeyhint="done" spellcheck="false" placeholder="Pilot" aria-label="Username">
            </section>

            <section class="settings-block">
                <p class="label">Fullscreen</p>
                <div class="fullscreen-choices" role="group" aria-label="Fullscreen">
                    <button type="button" class="fullscreen-btn" data-fullscreen="on">On</button>
                    <button type="button" class="fullscreen-btn is-on" data-fullscreen="off">Off</button>
                </div>
            </section>

            <section class="settings-block">
                <div class="settings-heading">
                    <p class="label">Balls</p>
                    <p class="value"><span id="balls-slider-value">75</span></p>
                </div>
                <input type="range" id="balls-slider" min="25" max="250" step="5" value="75" aria-label="Balls in the game">
            </section>

            <section class="settings-block">
                <div class="settings-heading">
                    <p class="label">Goal</p>
                    <p class="value"><span id="goal-slider-value">75</span></p>
                </div>
                <input type="range" id="goal-slider" min="5" max="75" step="5" value="75" aria-label="Balls to win">
            </section>

            <section class="settings-block">
                <p class="label">Colors</p>
                <div class="palette-choices" role="group" aria-label="Color palette">
                    <button type="button" class="palette-btn is-on" data-palette="rainbow">Rainbow</button>
                    <button type="button" class="palette-btn" data-palette="space">Space</button>
                    <button type="button" class="palette-btn" data-palette="dark">Dark</button>
                </div>
            </section>

            <section class="settings-block">
                <p class="label">Pulse</p>
                <div class="pulse-choices" role="group" aria-label="Ball pulse">
                    <button type="button" class="pulse-btn is-on" data-pulse="on">On</button>
                    <button type="button" class="pulse-btn" data-pulse="off">Off</button>
                </div>
            </section>

            <section class="settings-block">
                <p class="label">Ship</p>
                <div class="ship-choices" role="group" aria-label="Ship">
                    <button type="button" class="ship-btn is-on" data-ship="classic" aria-label="Classic ship">
                        <svg viewBox="0 0 32 40" aria-hidden="true">
                            <path fill="#dce7ff" d="M16 2 30 34 16 26 2 34Z"/>
                            <ellipse fill="#6aa2ff" cx="16" cy="18" rx="4" ry="5.5"/>
                        </svg>
                    </button>
                    <button type="button" class="ship-btn" data-ship="ship-1" aria-label="Crew ship">
                        <img src="public/images/ships/ship-1.png" alt="">
                    </button>
                </div>
            </section>

            <section class="settings-block">
                <p class="label">World size</p>
                <div class="world-sizes" role="group" aria-label="World size">
                    <button type="button" class="world-btn" data-world="5000" data-size="sm">sm</button>
                    <button type="button" class="world-btn" data-world="10000" data-size="md">md</button>
                    <button type="button" class="world-btn" data-world="15000" data-size="lg">lg</button>
                    <button type="button" class="world-btn is-on" data-world="20000" data-size="xl">xl</button>
                </div>
            </section>
            </div>

            <div class="settings-actions">
                <button type="button" class="settings-restart" id="settings-restart">Restart</button>
                <button type="button" class="settings-continue" id="settings-continue">Continue</button>
            </div>
        </div>
    </div>

    <div class="overlay hidden" id="resume-overlay" role="dialog" aria-modal="true" aria-labelledby="resume-title">
        <div class="win-card resume-card">
            <h1 id="resume-title">CONTINUE?</h1>
            <p id="resume-message">A game is in progress.</p>
            <div class="resume-actions">
                <button type="button" class="resume-new" id="resume-new">New game</button>
                <button type="button" class="resume-continue" id="resume-continue">Continue</button>
            </div>
        </div>
    </div>

    <div class="overlay hidden" id="win-overlay">
        <div class="win-card">
            <h1>YOU WON</h1>
            <p class="win-score" id="win-score">0</p>
            <p id="win-message">You reached the goal.</p>
            <button type="button" id="win-restart">Restart</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
