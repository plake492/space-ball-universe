<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Harlie Space Hunt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <canvas id="game" aria-label="Space hunt play area"></canvas>

    <section class="panel timer-panel" aria-label="Play time">
        <p class="label">Time</p>
        <p class="value" id="play-timer">0:00</p>
    </section>

    <div class="hud">
        <section class="panel score-panel" aria-live="polite">
            <p class="label">Found</p>
            <p class="value"><span id="found-count">0</span> / <span id="goal-count">75</span></p>
            <p class="sub" id="balls-left">75 balls in space</p>
        </section>

        <button type="button" class="settings-btn" id="open-settings">Settings</button>
    </div>

    <p class="coords" id="coords">0, 0</p>

    <div class="joystick" id="joystick" role="application" aria-label="Ship joystick">
        <div class="joystick-base">
            <span class="joystick-ring" data-ring="slow"></span>
            <span class="joystick-ring" data-ring="medium"></span>
            <span class="joystick-ring" data-ring="fast"></span>
            <div class="joystick-knob" id="joystick-knob"></div>
        </div>
    </div>

    <canvas id="minimap" class="minimap" aria-label="Minimap"></canvas>
    <p class="hint">W A S D or the joystick to fly</p>

    <div class="settings-overlay hidden" id="settings-menu" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="settings-sheet">
            <h1 id="settings-title">Settings</h1>

            <section class="settings-block">
                <div class="settings-heading">
                    <p class="label">Balls</p>
                    <p class="value"><span id="balls-slider-value">75</span></p>
                </div>
                <input type="range" id="balls-slider" min="25" max="250" step="5" value="75" aria-label="Balls in the game">
            </section>

            <section class="settings-block">
                <div class="settings-heading">
                    <p class="label">Goal</p>
                    <p class="value"><span id="goal-slider-value">75</span></p>
                </div>
                <input type="range" id="goal-slider" min="5" max="75" step="5" value="75" aria-label="Balls to win">
            </section>

            <section class="settings-block">
                <p class="label">Colors</p>
                <div class="palette-choices" role="group" aria-label="Color palette">
                    <button type="button" class="palette-btn is-on" data-palette="rainbow">Rainbow</button>
                    <button type="button" class="palette-btn" data-palette="space">Space</button>
                    <button type="button" class="palette-btn" data-palette="dark">Dark</button>
                </div>
            </section>

            <section class="settings-block">
                <p class="label">Pulse</p>
                <div class="pulse-choices" role="group" aria-label="Ball pulse">
                    <button type="button" class="pulse-btn is-on" data-pulse="on">On</button>
                    <button type="button" class="pulse-btn" data-pulse="off">Off</button>
                </div>
            </section>

            <section class="settings-block">
                <p class="label">World size</p>
                <div class="world-sizes" role="group" aria-label="World size">
                    <button type="button" class="world-btn" data-world="5000" data-size="sm">sm</button>
                    <button type="button" class="world-btn" data-world="10000" data-size="md">md</button>
                    <button type="button" class="world-btn" data-world="15000" data-size="lg">lg</button>
                    <button type="button" class="world-btn is-on" data-world="20000" data-size="xl">xl</button>
                </div>
            </section>

            <div class="settings-actions">
                <button type="button" class="settings-restart" id="settings-restart">Restart</button>
                <button type="button" class="settings-continue" id="settings-continue">Continue</button>
            </div>
        </div>
    </div>

    <div class="overlay hidden" id="win-overlay">
        <div class="win-card">
            <h1>YOU WON</h1>
            <p id="win-message">You reached the goal.</p>
            <button type="button" id="win-restart">Restart</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
